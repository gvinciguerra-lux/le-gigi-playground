<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>le-gigi-playground</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #1a1a1a; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 36rem; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; }
    p { color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>le-gigi-playground</h1>
    <p>Served by Cloudflare Workers. Edit <code>public/index.html</code> and push to <code>main</code> to deploy.</p>
  </main>
</body>
</html>
